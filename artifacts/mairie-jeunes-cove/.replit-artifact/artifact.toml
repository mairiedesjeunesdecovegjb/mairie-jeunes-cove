kind = "web"
previewPath = "/"
title = "Mairie des Jeunes de Covè"
version = "1.0.0"
id = "artifacts/mairie-jeunes-cove"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19552

[services.development]
run = "pnpm --filter @workspace/mairie-jeunes-cove run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mairie-jeunes-cove", "run", "build" ]
publicDir = "artifacts/mairie-jeunes-cove/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19552"
BASE_PATH = "/"
